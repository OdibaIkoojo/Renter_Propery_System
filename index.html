<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <meta name="description" content="RentFlow — a clean rental property management dashboard for landlords.">
  <title>RentFlow — Property Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#" data-page="dashboard" aria-label="RentFlow dashboard">
        <span class="brand-mark"><span data-icon="home"></span></span>
        <span class="brand-name"><strong>RentFlow</strong><small>PROPERTY MANAGER</small></span>
      </a>
      <div class="nav-label">WORKSPACE</div>
      <nav class="nav-list">
        <button class="nav-item active" data-page="dashboard"><span data-icon="grid"></span><span>Dashboard</span></button>
        <button class="nav-item" data-page="properties"><span data-icon="building"></span><span>Properties</span><span class="nav-count" id="nav-property-count">4</span></button>
        <button class="nav-item" data-page="tenants"><span data-icon="users"></span><span>Tenants</span></button>
        <button class="nav-item" data-page="payments"><span data-icon="wallet"></span><span>Rent &amp; Payments</span></button>
        <button class="nav-item" data-page="maintenance"><span data-icon="wrench"></span><span>Maintenance</span><span class="nav-count alert" id="nav-maintenance-count">3</span></button>
        <button class="nav-item" data-page="reports"><span data-icon="chart"></span><span>Reports</span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-help"><span class="help-symbol">✦</span><div><strong>Need a hand?</strong><p>Explore the demo and try the quick actions.</p></div></div>
      <button class="nav-item settings-link" data-page="settings"><span data-icon="settings"></span><span>Settings</span></button>
      <div class="sidebar-footer"><span class="online-dot"></span> Local demo workspace</div>
    </aside>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>
    <main class="main-area">
      <header class="topbar">
        <button class="icon-button menu-toggle" id="menu-toggle" aria-label="Open navigation" aria-expanded="false"><span data-icon="menu"></span></button>
        <div class="breadcrumbs"><span>Workspace</span><span class="crumb-slash">/</span><strong id="page-crumb">Dashboard</strong></div>
        <div class="topbar-actions">
          <label class="global-search desktop-search"><span data-icon="search"></span><input id="global-search" type="search" placeholder="Search anything..." aria-label="Search properties and tenants"><kbd>⌘ K</kbd></label>
          <button class="icon-button notification-button" id="notifications-button" aria-label="View alerts"><span data-icon="bell"></span><i></i></button>
          <div class="profile-chip"><span class="avatar avatar-blue">JD</span><span class="profile-copy"><strong>John Doe</strong><small>Property owner</small></span><span class="chevron">⌄</span></div>
        </div>
      </header>
      <div class="mobile-search-wrap"><label class="global-search mobile-search"><span data-icon="search"></span><input id="mobile-search" type="search" placeholder="Search properties and tenants..." aria-label="Search properties and tenants"></label></div>
      <section id="page-content" class="page-content" tabindex="-1"></section>
      <footer class="app-footer"><span>© <span id="current-year"></span> RentFlow</span><span>Built for simpler property management <span class="footer-heart">♥</span></span></footer>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/properties.js"></script>
  <script src="js/tenants.js"></script>
  <script src="js/leases.js"></script>
  <script src="js/payments.js"></script>
  <script src="js/maintenance.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
